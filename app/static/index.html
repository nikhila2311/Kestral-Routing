<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Home request router</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f8; --card: #ffffff; --text: #1b2733; --muted: #556474; --line: #d3dae1;
    --accent: #0b6e6e; --accent-text: #ffffff; --track: #e4e9ee;
    --warn-bg: #fff1d6; --warn-text: #6b4300; --error: #a3221b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181e; --card: #1b232b; --text: #e8edf2; --muted: #a3b1be; --line: #35414d;
      --accent: #4fc0bd; --accent-text: #06201f; --track: #2a343e;
      --warn-bg: #4a3610; --warn-text: #ffe2a8; --error: #ff9c94;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 20px 0 6px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-top: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  textarea, select { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 12px 0; }
  .spread { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
  button { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit;
    padding: 8px 12px; cursor: pointer; }
  button[type="submit"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600;
    padding: 8px 24px; }
  button:disabled { opacity: .6; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { font-size: .9rem; padding: 6px 10px; }
  .team { font-size: 1.4rem; font-weight: 700; overflow-wrap: anywhere; }
  .badge { background: var(--warn-bg); color: var(--warn-text); border-radius: 999px; padding: 3px 12px; font-size: .9rem;
    font-weight: 600; }
  ul { margin: 0; padding-left: 20px; overflow-wrap: anywhere; }
  .question { border-left: 4px solid var(--accent); padding: 4px 0 4px 12px; overflow-wrap: anywhere; }
  .bar { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 56px; gap: 10px; align-items: center; margin: 6px 0; }
  .track { background: var(--track); border-radius: 4px; height: 14px; overflow: hidden; }
  .fill { background: var(--accent); height: 100%; }
  .number { text-align: right; font-variant-numeric: tabular-nums; }
  .error { color: var(--error); font-weight: 600; margin: 12px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Request router</h1>
  <p class="muted" id="status">Checking the model…</p>

  <form class="card" id="form" novalidate>
    <label for="request_text">Customer request</label>
    <textarea id="request_text" aria-describedby="count"></textarea>
    <p class="muted" id="count">0 / 2,000 characters</p>
    <div class="row">
      <div><label for="channel">Channel (optional)</label><select id="channel"></select></div>
      <div><label for="product_family">Product (optional)</label><select id="product_family"></select></div>
      <div><label for="warranty_status">Warranty (optional)</label><select id="warranty_status"></select></div>
    </div>
    <button type="submit" id="submit">Submit</button>
    <p class="error" id="error" role="alert" hidden></p>
    <h2>Try an example</h2>
    <div class="examples">
      <button type="button" data-text="My mixer grinder stopped working and makes a burning smell">Clear repair</button>
      <button type="button" data-text="New ceiling fan delivered, please send someone to install it">Clear installation</button>
      <button type="button" data-text="I paid for installation but technician never came">Paid, but not a payment problem</button>
      <button type="button" data-text="please call me about my purifier">Vague request</button>
      <button type="button" data-text="Is it normal that my cooktop makes a humming sound">Close call</button>
    </div>
  </form>

  <section class="card" id="result" aria-live="polite" hidden>
    <p class="muted" id="team_label">Team</p>
    <div class="spread">
      <span class="team" id="team"></span>
      <span class="badge" id="badge" hidden>Needs a clarifying question</span>
    </div>
    <p class="muted">Confidence <span id="confidence"></span></p>
    <div id="question_block" hidden>
      <h2>Ask the customer</h2>
      <p class="question" id="question"></p>
    </div>
    <h2>Reasons</h2>
    <ul id="reasons"></ul>
    <h2>Top teams</h2>
    <div id="bars"></div>
    <p class="muted">Model <span id="version"></span></p>
  </section>
</main>

<script type="application/json" id="options">__OPTIONS__</script>
<script>
"use strict";
// Everything from the server is shown with textContent, so it can never become markup.
const LIMIT = 2000;
const FIELDS = ["channel", "product_family", "warranty_status"];
const byId = (id) => document.getElementById(id);
const percent = (x) => (x * 100).toFixed(1) + "%";
let latest = 0;

function element(tag, text, className) {
  const node = document.createElement(tag);
  node.textContent = text;
  if (className) node.className = className;
  return node;
}

function fillDropdowns() {
  const options = JSON.parse(byId("options").textContent);
  for (const field of FIELDS) {
    const first = element("option", "Not given");
    first.value = "";
    byId(field).append(first);
    for (const value of options[field]) {
      const option = element("option", value.replaceAll("_", " "));
      option.value = value;
      byId(field).append(option);
    }
  }
}

function updateCount() {
  const length = [...byId("request_text").value].length;
  byId("count").textContent = length.toLocaleString("en") + " / " + LIMIT.toLocaleString("en") + " characters";
}

function showError(message) {
  byId("result").hidden = true;
  byId("error").textContent = message;
  byId("error").hidden = false;
}

function showResult(out) {
  byId("error").hidden = true;
  byId("team_label").textContent = out.needs_triage ? "First guess, not yet sent to a team" : "Team";
  byId("team").textContent = out.team;
  byId("badge").hidden = !out.needs_triage;
  byId("confidence").textContent = percent(out.confidence);
  byId("question_block").hidden = !out.clarifying_question;
  byId("question").textContent = out.clarifying_question || "";
  byId("reasons").replaceChildren(...out.reasons.map((reason) => element("li", reason)));
  byId("bars").replaceChildren(...out.top3.map((item) => {
    const bar = element("div", "", "bar");
    const track = element("div", "", "track");
    const fill = element("div", "", "fill");
    fill.style.width = percent(item.prob);
    track.append(fill);
    bar.append(element("span", item.team), track, element("span", percent(item.prob), "number"));
    return bar;
  }));
  byId("version").textContent = out.model_version;
  byId("result").hidden = false;
}

async function send() {
  const call = ++latest;  // only the newest answer is shown
  const body = { request_text: byId("request_text").value };
  for (const field of FIELDS) if (byId(field).value) body[field] = byId(field).value;
  byId("submit").disabled = true;
  try {
    const response = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const out = await response.json();
    if (call !== latest) return;
    if (response.ok) showResult(out);
    else showError(out.detail);
  } catch (error) {
    if (call === latest) showError("The service could not be reached. Is it still running?");
  } finally {
    if (call === latest) byId("submit").disabled = false;
  }
}

async function showStatus() {
  try {
    const health = await (await fetch("/health")).json();
    byId("status").textContent = health.model_loaded
      ? "Model trained on requests from " + health.training_window
      : "The model is not loaded. Run the train step (see the README) and restart the service.";
  } catch (error) {
    byId("status").textContent = "The service could not be reached.";
  }
}

byId("form").addEventListener("submit", (event) => {
  event.preventDefault();
  send();
});
byId("request_text").addEventListener("input", updateCount);
for (const button of document.querySelectorAll("button[data-text]")) {
  button.addEventListener("click", () => {
    byId("request_text").value = button.dataset.text;
    for (const field of FIELDS) byId(field).value = "";
    updateCount();
    send();
  });
}
fillDropdowns();
updateCount();
showStatus();
</script>
</body>
</html>
